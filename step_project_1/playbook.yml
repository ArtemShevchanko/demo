---
- name: Configure database server
  hosts: db
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install MySQL server and Python MySQL library
      apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present

    - name: Make MySQL listen on private network
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = {{ db_host }}'
      notify: Restart MySQL

    - name: Start and enable MySQL
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Create PetClinic database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create PetClinic MySQL user
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        host: "%"
        priv: "{{ db_name }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

  handlers:
    - name: Restart MySQL
      service:
        name: mysql
        state: restarted


- name: Configure application server
  hosts: app
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java, Git and Maven dependencies
      apt:
        name:
          - openjdk-17-jdk
          - git
          - maven
        state: present

    - name: Create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        home: "{{ app_dir }}"
        create_home: yes

    - name: Add Spring PetClinic directory to Git safe directories
      command: git config --global --add safe.directory {{ project_dir }}
      changed_when: false

    - name: Clone Spring PetClinic repository
      git:
        repo: "https://github.com/spring-projects/spring-petclinic.git"
        dest: "{{ project_dir }}"
        version: main
        force: yes

    - name: Set project directory owner
      file:
        path: "{{ project_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    - name: Build PetClinic jar
      command: ./mvnw package -DskipTests
      args:
        chdir: "{{ project_dir }}"

    - name: Copy jar to application user home
      shell: cp {{ project_dir }}/target/*.jar {{ app_jar }}
      args:
        executable: /bin/bash

    - name: Set jar owner
      file:
        path: "{{ app_jar }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Create systemd service for PetClinic
      template:
        src: templates/petclinic.service.j2
        dest: /etc/systemd/system/petclinic.service

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable PetClinic service
      systemd:
        name: petclinic
        state: restarted
        enabled: yes